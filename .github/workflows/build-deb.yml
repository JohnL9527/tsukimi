name: Build Tsukimi Deb
on:
  push:
    branches: [ 25.05-rc1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y libgtk-4-dev libadwaita-1-dev libmpv-dev libgtk4-layer-shell-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev gettext \
            pkgconf build-essential dpkg-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Compile Tsukimi
        run: cargo build --release -p tsukimi

      - name: Prepare deb structure
        run: |
          mkdir -p deb/usr/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb/usr/share/doc/tsukimi
          mkdir -p deb/DEBIAN

          cp target/release/tsukimi deb/usr/bin/
          chmod 755 deb/usr/bin/tsukimi

          echo '[Desktop Entry]' > deb/usr/share/applications/tsukimi.desktop
          echo 'Name=Tsukimi' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Comment=Jellyfin Client' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Exec=tsukimi' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Terminal=false' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Type=Application' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Categories=AudioVideo;Player;' >> deb/usr/share/applications/tsukimi.desktop
          echo 'Icon=tsukimi' >> deb/usr/share/applications/tsukimi.desktop

          # 这里是你找到的主程序图标
          cp resources/icons/moe.tsuna.tsukimi.png deb/usr/share/icons/hicolor/256x256/apps/tsukimi.png

          echo 'Package: tsukimi' > deb/DEBIAN/control
          echo 'Version: 25.5.0~rc1' >> deb/DEBIAN/control
          echo 'Architecture: amd64' >> deb/DEBIAN/control
          echo 'Maintainer: Tsukimi Builder <builder@example.com>' >> deb/DEBIAN/control
          echo 'Depends: libgtk-4-1, libadwaita-1-0, libmpv1, gstreamer1.0-plugins-base' >> deb/DEBIAN/control
          echo 'Description: Tsukimi - Simple Jellyfin client for Linux' >> deb/DEBIAN/control
          echo ' Tsukimi is a native Linux client for the Jellyfin media server.' >> deb/DEBIAN/control

          echo "===== DEBUG: print DEBIAN/control ====="
          cat deb/DEBIAN/control

      - name: Build deb package
        run: dpkg-deb --build --root-owner-group deb tsukimi_25.5.0-rc1_amd64.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tsukimi-deb
          path: tsukimi_25.5.0-rc1_amd64.deb
